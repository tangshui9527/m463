name: Build m79 kernel

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies & 32-bit compatibility
        run: |
          set -e
          sudo add-apt-repository -y universe
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libncurses5-dev \
            libncursesw5-dev \
            lzop \
            u-boot-tools \
            python2 \
            libc6:i386 \
            libstdc++6:i386 \
            zlib1g:i386
          # Ensure python points to python2 for MTK legacy scripts
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          python --version
          # Ensure build tools are executable
          chmod -R +x mediatek/build/tools || true

      - name: Install cross toolchain (gcc 4.9.4)
        run: |
          set -e
          cd /opt
          wget -q https://mirrors.edge.kernel.org/pub/tools/crosstool/files/bin/x86_64/4.9.4/x86_64-gcc-4.9.4-nolibc-arm-linux-gnueabi.tar.xz
          tar xf x86_64-gcc-4.9.4-nolibc-arm-linux-gnueabi.tar.xz
          echo "/opt/gcc-4.9.4-nolibc/arm-linux-gnueabi/bin" >> $GITHUB_PATH

      - name: Verify toolchain
        run: |
          arm-linux-gnueabi-gcc --version | head -1
          which arm-linux-gnueabi-gcc

      - name: Build kernel (m79)
        run: |
          set -e
          ./build.sh m79

      - name: Collect artifacts
        run: |
          set -e
          mkdir -p artifacts
          find . -name "kernel_m79.bin" -exec cp {} artifacts/ \; 2>/dev/null || true
          find . -name "zImage*" -path "*m79*" -exec cp {} artifacts/ \; 2>/dev/null || true
          find out -name "*.bin" -exec cp {} artifacts/ \; 2>/dev/null || true
          find out -name ".config" -exec cp {} artifacts/kernel.config.m79 \; 2>/dev/null || true
          ls -la artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: m79-kernel
          path: artifacts/
          retention-days: 30
